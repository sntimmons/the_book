name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --legacy-peer-deps
      # Cheap static checks first (fail fast), then the unit suite. Every step is
      # blocking — no `|| true`, no continue-on-error.
      - name: Typecheck
        run: npm run typecheck
      # Baseline lint gate: fails on ANY ESLint error, and on more than the frozen
      # warning baseline (see lint:ci in package.json). New lint debt blocks PRs;
      # the existing backlog does not. The baseline number should only decrease.
      - name: Lint (baseline gate)
        run: npm run lint:ci
      - name: Unit tests
        run: npm test -- --runInBand
