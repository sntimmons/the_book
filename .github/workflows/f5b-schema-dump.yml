name: F5B schema dump (temporary)

# Temporary, manually-triggered workflow for F5B-C2: produce a READ-ONLY,
# schema-only dump of the production public schema on an Ubuntu runner, and
# upload it as an artifact. It performs NO writes and NO migration-history
# operations. Delete this workflow after the dump artifact is retrieved.

on:
  workflow_dispatch: {}

permissions:
  contents: read            # no write access to the repository

jobs:
  schema-dump:
    runs-on: ubuntu-latest
    env:
      # Secrets are consumed by the Supabase CLI via these env vars; they are
      # never echoed. GitHub also masks them in logs.
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      EXPECTED_REF: kxregomuawwcqvisuhtr    # production ref, pinned

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Supabase CLI (pinned to the audited version)
        uses: supabase/setup-cli@v1
        with:
          version: 2.115.0

      - name: Guard - only the expected production ref
        run: |
          if [ "$EXPECTED_REF" != "kxregomuawwcqvisuhtr" ]; then
            echo "Unexpected project ref: $EXPECTED_REF"; exit 1
          fi
          echo "Target ref confirmed: $EXPECTED_REF"

      - name: Dry-run - print the pg_dump script (no execution)
        # Direct project targeting via --project-ref (no link, no --linked, no
        # local link state). Auth: SUPABASE_ACCESS_TOKEN + SUPABASE_DB_PASSWORD
        # from env; the password is never on the command line.
        run: supabase db dump --project-ref "$EXPECTED_REF" --schema public --dry-run

      - name: Schema-only dump of the public schema (no data)
        # No --data-only, so this is schema-only. pg_dump is read-only (SELECT +
        # ACCESS SHARE lock). No db push/pull/reset/migration repair/up anywhere.
        run: supabase db dump --project-ref "$EXPECTED_REF" --schema public -f f5b-c2-production-schema.sql

      - name: Refuse to upload if any data statements are present
        run: |
          if grep -qiE '^[[:space:]]*(COPY |INSERT INTO )' f5b-c2-production-schema.sql; then
            echo "Data statements found - aborting (schema-only expected)"; exit 1
          fi
          echo "Schema-only confirmed; lines: $(wc -l < f5b-c2-production-schema.sql)"

      - name: Upload schema dump artifact
        uses: actions/upload-artifact@v4
        with:
          name: f5b-c2-production-schema
          path: f5b-c2-production-schema.sql
          retention-days: 7
